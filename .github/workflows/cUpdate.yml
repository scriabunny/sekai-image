name: Weekly Thumbnail

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - env:
          SHEET_2: ${{ secrets.SHEET_2 }}
          GID_2: ${{ secrets.GID_2 }}
          CELL_RANGE_2: ${{ secrets.CELL_RANGE_2 }}
          BASE_URL_2: ${{ secrets.BASE_URL_2 }}
          VARIANTS_2: ${{ secrets.VARIANTS_2 }}
        run: python card.py

      - run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (
            git commit -m "Update assets"
            git push
          )