name: Monthly Plush

on:
  schedule:
    - cron: "0 0 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - env:
          SHEET_1: ${{ secrets.SHEET_1 }}
          GID_1: ${{ secrets.GID_1 }}
          CELL_RANGE_1: ${{ secrets.CELL_RANGE_1 }}
          BASE_URL_1: ${{ secrets.BASE_URL_1 }}
          VARIANTS_1: ${{ secrets.VARIANTS_1 }}
          FOLDER_1: ${{ secrets.FOLDER_1 }}
        run: python plush.py

      - run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (
            git commit -m "Update assets"
            git push
          )